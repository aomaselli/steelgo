name: verificacao

# POR QUE ESTE ARQUIVO EXISTE
# Até agora os checks do GitHub neste repositório eram só da Vercel: o
# deployment de Preview (que roda `npm ci` + `vite build`) e um bot de
# comentários. Nenhum deles executa `tsc`, `vitest` ou `eslint` — ou seja, o
# "✅ All checks have passed" garantia apenas que o aplicativo empacota. Teste
# quebrado e erro de tipo passavam direto.

on:
  pull_request:
  workflow_dispatch:

# Uma execução por referência: push novo cancela a anterior, que já não importa.
concurrency:
  group: verificacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar com o lockfile
        run: npm ci 2>&1 | tee npm-ci.log
        shell: bash

      # ------------------------------------------------------------------
      # TypeScript: compara DIAGNÓSTICOS, não contagens. Nada de sucesso forçado.
      # ------------------------------------------------------------------
      # Contagem igual não prova ausência de regressão: um erro novo que apaga
      # um antigo mantém o número e passa despercebido. A comparação aqui é do
      # CONJUNTO — arquivo, código e mensagem de cada diagnóstico, com a
      # quantidade de ocorrências. Linha e coluna ficam de fora de propósito:
      # elas andam a cada edição e acusariam regressão onde não houve.
      #
      # O `set +e` existe só para CAPTURAR a saída do tsc; quem decide o
      # resultado é o `diff` contra a linha de base versionada, que chama
      # `exit 1` quando aparece diagnóstico novo. Não há `|| true` governando
      # o resultado deste passo.
      - name: Verificar tipos (diagnósticos, não contagens)
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > tsc.log 2>&1
          saida_tsc=$?
          set -e
          node .github/scripts/diagnosticos-tsc.mjs tsc.log > tsc-diagnosticos.txt
          echo "tsc terminou com codigo $saida_tsc"
          if diff -u .github/tsc-baseline.txt tsc-diagnosticos.txt > tsc-diff.txt; then
            echo "conjunto de diagnosticos identico a linha de base"
            exit 0
          fi
          echo "--- diferenca contra a linha de base ---"
          cat tsc-diff.txt
          novos=$(grep -c '^+[^+]' tsc-diff.txt || true)
          resolvidos=$(grep -c '^-[^-]' tsc-diff.txt || true)
          if [ "$novos" -gt 0 ]; then
            echo "::error::$novos diagnostico(s) de tipo novo(s) ou mais frequente(s). Veja tsc-diff.txt no artefato."
            exit 1
          fi
          echo "::notice::$resolvidos diagnostico(s) resolvido(s) e nenhum novo. Atualize .github/tsc-baseline.txt neste PR."

      # ------------------------------------------------------------------
      # Suíte de testes
      # ------------------------------------------------------------------
      # `pipefail` garante que o `tee` não engula a falha do vitest.
      - name: Rodar a suíte
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee vitest.log

      - name: Empacotar
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      # `if: always()` é o que preserva o log QUANDO FALHA — que é justamente
      # quando ele serve para alguma coisa.
      - name: Preservar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-verificacao-${{ github.run_id }}
          path: |
            npm-ci.log
            tsc.log
            tsc-diagnosticos.txt
            tsc-diff.txt
            vitest.log
            build.log
          if-no-files-found: warn
          retention-days: 30
